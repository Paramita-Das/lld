<section class="problem-example autocomplete-problem">
  <div class="problem-example-header">
    <h3>Autocomplete</h3>
    <p class="problem-example-copy">
      Type to filter a local dataset and click a suggestion to populate the input.
    </p>
  </div>

  <input
    type="text"
    class="autocomplete-input"
    data-autocomplete-input
    placeholder="Start typing a fruit name..."
    autocomplete="off"
  />

  <ul class="suggestions-list" data-suggestions-list></ul>
</section>
